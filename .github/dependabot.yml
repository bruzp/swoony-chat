version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      patch:
        update-types: [patch]
      minor:
        update-types: [minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Manila
    commit-message:
      prefix: ci
    groups:
      actions-patch:
        update-types: [patch]
      actions-minor:
        update-types: [minor]
